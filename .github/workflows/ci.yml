name: CI

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:
    branches:
      - main
      - arena/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify brand tokens
        run: |
          # Verify tokens.css matches upstream (N2 guard)
          UPSTREAM_REF="807fc1a"
          curl -sL "https://raw.githubusercontent.com/tomblakeasaah196/praxis-ls/$UPSTREAM_REF/packages/brand/tokens.css" > /tmp/upstream_tokens.css
          if ! diff -q src/brand/tokens.css /tmp/upstream_tokens.css > /dev/null 2>&1; then
            echo "ERROR: tokens.css has diverged from upstream ref $UPSTREAM_REF"
            echo "Run: diff src/brand/tokens.css /tmp/upstream_tokens.css"
            exit 1
          fi

      - name: Check for raw hex outside brand tokens
        run: |
          # Find hex colors outside the brand tokens file
          HEX_PATTERN='#[0-9A-Fa-f]{3,6}\b'
          VIOLATIONS=$(grep -r "$HEX_PATTERN" src/ --include="*.astro" --include="*.ts" --include="*.tsx" --include="*.css" | grep -v "brand/tokens.css" | grep -v "brand/index.js" | grep -v "\.astro?lang=" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Raw hex found outside vendored token file:"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Check for forbidden fonts
        run: |
          FORBIDDEN='Montserrat|Roboto|Open Sans|Lato|Poppins'
          VIOLATIONS=$(grep -ri "$FORBIDDEN" src/ --include="*.astro" --include="*.ts" --include="*.css" 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Forbidden font found:"
            echo "$VIOLATIONS"
            exit 1
          fi

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Build site
        run: npm run build

      - name: Preview site
        run: npm run preview &
        sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4321/en/
            http://localhost:4321/fr/
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
